<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#142433;
    --ink-soft:#4B5A68;
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --border:#E1E5E9;
    --accent:#2E6F6B;
    --accent-dark:#1F4F4C;
    --todo:#5B6472;
    --progress:#2E6F6B;
    --overdue:#C4592B;
    --completed:#3F7D4F;
    --cancelled:#9AA0AA;
    --radius:10px;
    --shadow: 0 1px 2px rgba(20,36,51,0.06), 0 1px 12px rgba(20,36,51,0.04);
    --input-bg:#FCFDFD;
    --faint-border:#EEF1F3;
    --muted-text:#B7BEC5;
    --track-bg:#EDEFF1;
    --header-tint:#FAFBFC;
  }
  :root[data-theme="dark"]{
    --ink:#E8ECEF;
    --ink-soft:#93A1AD;
    --bg:#0E1620;
    --surface:#162230;
    --border:#283746;
    --accent:#3E8C87;
    --accent-dark:#5AA9A4;
    --todo:#8A94A0;
    --progress:#3E8C87;
    --overdue:#E17A4B;
    --completed:#57A86A;
    --cancelled:#6B7885;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 1px 14px rgba(0,0,0,0.3);
    --input-bg:#1B2836;
    --faint-border:#243240;
    --muted-text:#57646F;
    --track-bg:#24323F;
    --header-tint:#101A24;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:40px 36px; width:100%; max-width:380px; box-shadow:var(--shadow);
  }
  .login-card .brand{font-size:22px; font-weight:600; color:var(--ink); margin:0 0 4px;}
  .login-card p.sub{color:var(--ink-soft); font-size:14px; margin:0 0 28px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:6px;}
  .field input{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; color:var(--ink); background:var(--input-bg);
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .btn-primary{
    width:100%; padding:11px; background:var(--accent); color:#fff; border:none;
    border-radius:8px; font-size:14px; font-weight:600; margin-top:6px;
  }
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:disabled{opacity:0.6; cursor:default;}
  #login-error{color:var(--overdue); font-size:13px; margin-top:12px; display:none;}

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100vh; flex-direction:column;}
  header{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  header .brand{font-size:17px; font-weight:600; margin-right:8px;}
  select#project-select{
    padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; color:var(--ink); background:#fff;
  }
  .view-toggle{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .view-toggle button{
    padding:7px 12px; border:none; background:#fff; font-size:13px; font-weight:500; color:var(--ink-soft);
  }
  .view-toggle button.active{background:var(--accent); color:#fff;}
  .spacer{flex:1;}
  .btn-new{
    background:var(--ink); color:#fff; border:none; padding:8px 14px; border-radius:8px;
    font-size:13px; font-weight:600;
  }
  .btn-new:hover{background:#0d1a25;}
  .who{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);}
  .avatar{
    width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0;
  }
  #logout-btn{background:none; border:1px solid var(--border); border-radius:7px; padding:7px 35px; font-size:12px; color:var(--ink-soft);}
  #logout-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  main{flex:1; padding:20px; overflow:auto;}

  /* ---------- Board ---------- */
  #board-view{display:grid; grid-template-columns:repeat(5,minmax(220px,1fr)); gap:14px; align-items:start;}
  .column{background:transparent;}
  .col-head{
    display:flex; align-items:center; gap:8px; padding:0 4px 10px;
    font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .col-count{color:var(--ink-soft); font-weight:500;}
  .col-drop{
    min-height:60px; border-radius:12px; padding:4px; transition:background .12s;
  }
  .col-drop.drag-over{background:rgba(46,111,107,0.08);}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 13px; margin-bottom:10px; box-shadow:var(--shadow); cursor:grab;
  }
  .card:active{cursor:grabbing;}
  .card .proj-tag{font-size:10.5px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.02em; margin-bottom:5px;}
  .card .group-tag{font-size:10.5px; color:var(--ink-soft); font-weight:500; margin-bottom:5px;}
  .card .title{font-size:13.5px; font-weight:500; line-height:1.4; color:var(--ink); margin-bottom:9px;}
  .card .meta{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--ink-soft);}
  .card .due{display:flex; align-items:center; gap:4px;}
  .card .due.is-late{color:var(--overdue); font-weight:600;}
  .card .avatar{width:22px; height:22px; font-size:10.5px;}
  .empty-col{font-size:12.5px; color:var(--muted-text); padding:8px 6px; text-align:center;}
  .progress-pct{font-size:10.5px; color:var(--ink-soft); margin-top:4px; text-align:right;}

  /* ---------- Timeline / Gantt ---------- */
  #timeline-view{display:none;}
  .gantt-toolbar{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .tl-nav-btn{
    width:30px; height:30px; border:1px solid var(--border); background:#fff; border-radius:7px;
    font-size:15px; color:var(--ink-soft); line-height:1;
  }
  .tl-nav-btn:hover{border-color:var(--accent); color:var(--accent);}
  #tl-month-select{
    padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; color:var(--ink); background:#fff; min-width:160px;
  }
  .gantt-wrap{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  .gantt-header{display:flex; border-bottom:1px solid var(--border);}
  .gantt-label-col{width:260px; flex-shrink:0; padding:10px 14px; font-size:12px; font-weight:600; color:var(--ink-soft); border-right:1px solid var(--border);}
  .gantt-scale{flex:1; position:relative; height:34px;}
  .gantt-tick{position:absolute; top:0; bottom:0; border-left:1px solid var(--border); font-size:10.5px; color:var(--ink-soft); padding:9px 0 0 5px; white-space:nowrap;}
  .gantt-row{display:flex; border-bottom:1px solid var(--border); min-height:46px;}
  .gantt-row:last-child{border-bottom:none;}
  .gantt-row-label{
    width:260px; flex-shrink:0; padding:10px 14px; border-right:1px solid var(--border);
    font-size:12.5px; color:var(--ink); display:flex; align-items:center; gap:7px;
  }
  .gantt-row-label .proj-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .gantt-track{flex:1; position:relative; overflow:hidden;}
  .gantt-grid-line{position:absolute; top:0; bottom:0; border-left:1px solid var(--faint-border);}
  .gantt-today{position:absolute; top:0; bottom:0; border-left:2px solid var(--overdue); z-index:2;}
  .gantt-month-band{position:absolute; top:0; bottom:0; background:rgba(46,111,107,0.07); z-index:0;}
  .gantt-bar{
    position:absolute; top:9px; height:28px; border-radius:6px; cursor:pointer; z-index:1;
    display:flex; align-items:center; padding:0 9px; font-size:11.5px; color:#fff; font-weight:500;
    overflow:hidden; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,0.12);
  }
  .gantt-bar span{position:relative; z-index:1;}
  .empty-state{padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}

  /* ---------- Dashboard ---------- */
  #dashboard-view{display:none;}
  .dash-grid{display:grid; grid-template-columns:280px 1fr; gap:16px; align-items:start;}
  .dash-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; box-shadow:var(--shadow);}
  .dash-card h3{margin:0 0 14px; font-size:14px; color:var(--ink-soft); font-weight:600;}
  .big-ring{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .big-ring .num{font-size:34px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .big-ring .lbl{font-size:12.5px; color:var(--ink-soft);}
  .stat-rows{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
  .stat-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .stat-row .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .stat-row .lbl{flex:1; color:var(--ink-soft);}
  .stat-row .val{font-weight:600;}
  .proj-progress-row{margin-bottom:16px;}
  .proj-progress-row:last-child{margin-bottom:0;}
  .proj-progress-head{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .proj-progress-head .name{font-weight:500; display:flex; align-items:center; gap:7px;}
  .proj-progress-head .pct{color:var(--ink-soft);}
  .task-list-row{
    display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--faint-border); font-size:12.5px;
  }
  .task-list-row:last-child{border-bottom:none;}
  .task-list-row .t-name{flex:1; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}
  .task-list-row .t-name:hover{text-decoration:underline;}
  .task-list-row .t-status{
    font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; color:#fff; flex-shrink:0;
  }
  .task-list-row .t-due{width:80px; text-align:right; color:var(--ink-soft); flex-shrink:0; font-size:11.5px;}
  .ach-bar-track{height:6px; border-radius:3px; background:var(--track-bg); overflow:hidden; margin-top:6px;}
  .ach-bar-fill{height:100%; border-radius:3px; background:var(--completed);}

  /* ---------- Gantt group headers ---------- */
  .gantt-group-header{
    display:flex; background:var(--header-tint); border-bottom:1px solid var(--border);
  }
  .gantt-group-header .glabel{
    width:260px; flex-shrink:0; padding:7px 14px; font-size:11px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.03em; border-right:1px solid var(--border);
  }
  .gantt-group-header .gtrack{flex:1;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(20,36,51,0.45);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:#fff; border-radius:14px; width:100%; max-width:440px; padding:26px;
    box-shadow:0 12px 40px rgba(0,0,0,0.2); max-height:90vh; overflow:auto;
  }
  .modal h3{margin:0 0 18px; font-size:17px;}
  .modal .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; color:var(--ink); background:var(--input-bg);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-secondary{background:#fff; border:1px solid var(--border); color:var(--ink); padding:9px 14px; border-radius:8px; font-size:13px; font-weight:500;}
  .btn-danger{background:none; border:none; color:var(--overdue); font-size:13px; font-weight:500; padding:9px 4px; margin-right:auto;}
  #close-modal{position:absolute; top:0; right:0;}
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .modal-head button{background:none; border:none; font-size:20px; color:var(--ink-soft); line-height:1; padding:2px;}

  /* ---------- Attachments ---------- */
  .attach-list{margin:2px 0 10px; display:flex; flex-direction:column; gap:6px;}
  .attach-item{
    display:flex; align-items:center; gap:8px; padding:7px 9px; border:1px solid var(--border);
    border-radius:8px; font-size:12.5px; background:var(--input-bg);
  }
  .attach-item .a-icon{font-size:14px;}
  .attach-item .a-name{flex:1; color:var(--ink); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attach-item .a-name:hover{text-decoration:underline; cursor:pointer;}
  .attach-item .a-meta{color:var(--ink-soft); font-size:11px; flex-shrink:0;}
  .attach-item .a-del{background:none; border:none; color:var(--ink-soft); font-size:15px; padding:0 2px; flex-shrink:0;}
  .attach-item .a-del:hover{color:var(--overdue);}
  .attach-empty{font-size:12.5px; color:var(--muted-text); margin-bottom:8px;}
  .attach-upload{font-size:12.5px;}
  .attach-hint{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .attach-uploading{font-size:12px; color:var(--ink-soft); margin-top:6px;}

  @media (max-width:900px){
    #board-view{grid-template-columns:1fr; }
  }
  .theme-toggle-btn{
    position:fixed; top:12px; right:10px; z-index:60;
    width:33px; height:33px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:15px;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  }
  .theme-toggle-btn:hover{border-color:var(--accent);}
</style>
</head>
<body>

<button id="theme-toggle" class="theme-toggle-btn" title="Toggle dark mode">🌙</button>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <p class="brand">መተግበሪያ ለመፍትሔ</p>
    <p class="sub">በኢሜሎ በመፈረም የተቋሙን ዕቅድ እንዲሳካ በትብብር ይስሩ.</p>
    <form id="login-form">
      <div class="field">
        <label for="login-email">ኢሜል</label>
        <input id="login-email" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">ማለፊያ ቃል</label>
        <input id="login-password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn-primary" type="submit" id="login-btn">አስገባኝ </button>
      <p id="login-error"></p>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <span class="brand">መተግበሪያ ለመፍትሔ</span>
    <select id="project-select"><option value="all">ሁሉም ስራዎች</option></select>
    <div class="view-toggle">
      <button id="btn-board" class="active">ስራዎች</button>
      <button id="btn-timeline">የግዜ ሰሌዳ</button>
      <button id="btn-dashboard">ሪፖርት</button>
    </div>
    <div class="spacer"></div>
    <button class="btn-new" id="new-task-btn">+ አዲስ ስራ</button>
    <div class="who">
      <div class="avatar" id="me-avatar">?</div>
      <span id="me-name">—</span>
      <button id="logout-btn">ለመውጣት </button>
    </div>
  </header>

  <main>
    <div id="board-view"></div>
    <div id="timeline-view"></div>
    <div id="dashboard-view"></div>
  </main>
</div>

<!-- ============ TASK MODAL ============ -->
<div class="modal-backdrop" id="task-modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">አዲስ ስራ</h3>
      <button id="close-modal">&times;</button>
    </div>
    <form id="task-form">
      <div class="field">
        <label for="f-name">Task name</label>
        <input id="f-name" required>
      </div>
      <div class="field">
        <label for="f-project">Project</label>
        <select id="f-project" required></select>
      </div>
      <div class="field">
        <label for="f-group">Group <span style="font-weight:400;color:var(--ink-soft);">(optional — phase/section within the project)</span></label>
        <div style="display:flex; gap:8px;">
          <select id="f-group" style="flex:1;"></select>
          <button type="button" id="new-group-btn" class="btn-secondary" style="flex-shrink:0;">+ Group</button>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option>To Do</option>
            <option>In Progress</option>
            <option>Overdue</option>
            <option>Completed</option>
            <option>Cancelled</option>
          </select>
        </div>
        <div class="field">
          <label for="f-assignee">Assigned to</label>
          <select id="f-assignee"></select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-start">Start date</label>
          <input id="f-start" type="date">
        </div>
        <div class="field">
          <label for="f-due">Due date</label>
          <input id="f-due" type="date">
        </div>
      </div>
      <div class="field">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes"></textarea>
      </div>
      <div class="field" id="attachments-field">
        <label>Documents</label>
        <div class="attach-list" id="attach-list"></div>
        <div id="attach-hint" class="attach-hint" style="display:none;">በቅድሚያ ስራውን ከመዘገቡ በዋላ ለማስረጃ ማስቀመጫ ምቹ የሆናል.</div>
        <input type="file" id="attach-input" class="attach-upload">
        <div id="attach-uploading" class="attach-uploading" style="display:none;">Uploading…</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="delete-task-btn" style="display:none;">ሰርዝ ስራውን</button>
        <button type="button" class="btn-secondary" id="cancel-modal-btn">አቋርጥ</button>
        <button type="submit" class="btn-primary" style="width:auto;">መዝግብ</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ NEW PROJECT MODAL ============ -->
<div class="modal-backdrop" id="project-modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3>አዲስ ፕሮጄክት</h3>
      <button id="close-project-modal">&times;</button>
    </div>
    <form id="project-form">
      <div class="field">
        <label for="p-name">ፕሮጄክት ስም</label>
        <input id="p-name" required>
      </div>
      <div class="field">
        <label for="p-desc">መገለጫ</label>
        <textarea id="p-desc"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-project-btn">አቋርጥ</button>
        <button type="submit" class="btn-primary" style="width:auto;">ፍጠር</button>
      </div>
    </form>
  </div>
</div>

<script>
// ======================================================================
// CONFIG — your Supabase project

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('ops-theme', t); } catch(e){}
  document.getElementById('theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}
(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('ops-theme'); } catch(e){}
  const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
})();
document.getElementById('theme-toggle').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

const STATUS_COLOR = {
  'To Do':'var(--todo)', 'In Progress':'var(--progress)', 'Overdue':'var(--overdue)',
  'Completed':'var(--completed)', 'Cancelled':'var(--cancelled)'
};
const PROJECT_COLORS = ['#2E6F6B','#5B6472','#8A5A9E','#C4592B','#3F7D4F','#3F6FA8'];

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) {
    err.textContent = error.message === 'Invalid login credentials'
      ? 'Wrong email or password.' : error.message;
    err.style.display = 'block';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
});

sb.auth.onAuthStateChange((event, session) => {
  if (session) { boot(session); } else { showLogin(); }
});

function showLogin(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

async function boot(session){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  await loadAll();
  const me = state.profiles.find(p => p.id === session.user.id);
  state.me = me || { id: session.user.id, full_name: session.user.email, email: session.user.email };
  document.getElementById('me-name').textContent = state.me.full_name;
  document.getElementById('me-avatar').textContent = initials(state.me.full_name);

  renderProjectSelect();
  renderAssigneeSelect();
  renderProjectFormSelect();
  render();
  subscribeRealtime();
}

function initials(name){
  return (name||'?').split(' ').filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join('');
}
function projectColor(projectId){
  const idx = state.projects.findIndex(p => p.id === projectId);
  return PROJECT_COLORS[idx % PROJECT_COLORS.length] || '#5B6472';
}
function projectName(id){
  const p = state.projects.find(p => p.id === id);
  return p ? p.name : '—';
}

// ---------------------------------------------------------------------
// DATA LOADING
// ---------------------------------------------------------------------
async function loadAll(){
  const [{ data: profiles }, { data: projects }, { data: groups }, { data: tasks }] = await Promise.all([
    sb.from('profiles').select('*').order('full_name'),
    sb.from('projects').select('*').order('created_at'),
    sb.from('task_groups').select('*').order('position'),
    sb.from('tasks').select('*').order('created_at'),
  ]);
  state.profiles = profiles || [];
  state.projects = projects || [];
  state.groups = groups || [];
  state.tasks = tasks || [];
}

function subscribeRealtime(){
  sb.channel('public:tasks')
    .on('postgres_changes', { event:'*', schema:'public', table:'tasks' }, (payload) => {
      applyTaskChange(payload);
      render();
    }).subscribe();

  sb.channel('public:projects')
    .on('postgres_changes', { event:'*', schema:'public', table:'projects' }, (payload) => {
      applyProjectChange(payload);
      renderProjectSelect();
      renderProjectFormSelect();
      render();
    }).subscribe();

  sb.channel('public:task_groups')
    .on('postgres_changes', { event:'*', schema:'public', table:'task_groups' }, (payload) => {
      applyGroupChange(payload);
      renderGroupSelect(document.getElementById('f-project').value);
      render();
    }).subscribe();
}

function applyTaskChange(payload){
  const { eventType, new: n, old: o } = payload;
  if (eventType === 'INSERT') state.tasks.push(n);
  else if (eventType === 'UPDATE') {
    const i = state.tasks.findIndex(t => t.id === n.id);
    if (i > -1) state.tasks[i] = n; else state.tasks.push(n);
  } else if (eventType === 'DELETE') {
    state.tasks = state.tasks.filter(t => t.id !== o.id);
  }
}
function applyProjectChange(payload){
  const { eventType, new: n, old: o } = payload;
  if (eventType === 'INSERT') state.projects.push(n);
  else if (eventType === 'UPDATE') {
    const i = state.projects.findIndex(p => p.id === n.id);
    if (i > -1) state.projects[i] = n;
  } else if (eventType === 'DELETE') {
    state.projects = state.projects.filter(p => p.id !== o.id);
  }
}
function applyGroupChange(payload){
  const { eventType, new: n, old: o } = payload;
  if (eventType === 'INSERT') state.groups.push(n);
  else if (eventType === 'UPDATE') {
    const i = state.groups.findIndex(g => g.id === n.id);
    if (i > -1) state.groups[i] = n;
  } else if (eventType === 'DELETE') {
    state.groups = state.groups.filter(g => g.id !== o.id);
  }
}

function setView(v){
  state.activeView = v;
  document.getElementById('btn-board').classList.toggle('active', v==='board');
  document.getElementById('btn-timeline').classList.toggle('active', v==='timeline');
  document.getElementById('btn-dashboard').classList.toggle('active', v==='dashboard');
  document.getElementById('board-view').style.display = v==='board' ? 'grid' : 'none';
  document.getElementById('timeline-view').style.display = v==='timeline' ? 'block' : 'none';
  document.getElementById('dashboard-view').style.display = v==='dashboard' ? 'block' : 'none';
  render();
}

function visibleTasks(){
  return state.activeProject === 'all'
    ? state.tasks
    : state.tasks.filter(t => t.project_id === state.activeProject);
}

// ---------------------------------------------------------------------
// RENDER — BOARD
// ---------------------------------------------------------------------
function render(){
  if (state.activeView === 'board') renderBoard();
  else if (state.activeView === 'timeline') renderTimeline();
  else renderDashboard();
}

function renderBoard(){
  const el = document.getElementById('board-view');
  const tasks = visibleTasks();
  el.innerHTML = STATUSES.map(status => {
    const items = tasks.filter(t => t.status === status);
    return `
      <div class="column">
        <div class="col-head">
          <span class="dot" style="background:${STATUS_COLOR[status]}"></span>
          ${status} <span class="col-count">${items.length}</span>
        </div>
        <div class="col-drop" data-status="${status}">
          ${items.length ? items.map(cardHtml).join('') : '<div class="empty-col">No tasks</div>'}
        </div>
      </div>`;
  }).join('');

  el.querySelectorAll('.card').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('click', () => openTaskModal(card.dataset.id));
  });
  el.querySelectorAll('.col-drop').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const newStatus = col.dataset.status;
      const t = state.tasks.find(t => t.id === id);
      if (t && t.status !== newStatus) {
        t.status = newStatus; render();
        await sb.from('tasks').update({ status:newStatus }).eq('id', id);
      }
    });
  });
}

function cardHtml(t){
  const assignee = state.profiles.find(p => p.id === t.assignee_id);
  const group = state.groups.find(g => g.id === t.group_id);
  const today = new Date().toISOString().slice(0,10);
  const isLate = t.due_date && t.due_date < today && t.status !== 'Completed' && t.status !== 'Cancelled';
  return `
    <div class="card" draggable="true" data-id="${t.id}">
      ${state.activeProject==='all' ? `<div class="proj-tag" style="color:${projectColor(t.project_id)}">${escapeHtml(projectName(t.project_id))}</div>` : ''}
      ${group ? `<div class="group-tag">${escapeHtml(group.name)}</div>` : ''}
      <div class="title">${escapeHtml(t.name)}</div>
      <div class="meta">
        <span class="due ${isLate?'is-late':''}">${t.due_date ? fmtDate(t.due_date) : 'No due date'}</span>
        ${assignee ? `<span class="avatar" title="${escapeHtml(assignee.full_name)}">${initials(assignee.full_name)}</span>` : ''}
      </div>
    </div>`;
}

// ---------------------------------------------------------------------
// RENDER — TIMELINE / GANTT
// ---------------------------------------------------------------------
function renderTimeline(){
  const el = document.getElementById('timeline-view');
  const allDatedTasks = visibleTasks().filter(t => t.start_date && t.due_date);
  if (!allDatedTasks.length) {
    el.innerHTML = '<div class="empty-state">No tasks with both a start and due date yet — add dates to see them on the timeline.</div>';
    return;
  }

  // Build the list of months covered by the tasks, for the nav select
  const allDates = allDatedTasks.flatMap(t => [new Date(t.start_date), new Date(t.due_date)]);
  const rangeMin = new Date(Math.min(...allDates)), rangeMax = new Date(Math.max(...allDates));
  const monthList = [];
  let mc = new Date(rangeMin.getFullYear(), rangeMin.getMonth(), 1);
  const mEnd = new Date(rangeMax.getFullYear(), rangeMax.getMonth(), 1);
  while (mc <= mEnd) { monthList.push(new Date(mc)); mc.setMonth(mc.getMonth() + 1); }
  const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'gantt-toolbar';
  toolbar.innerHTML = `
    <button id="tl-prev" class="tl-nav-btn">‹</button>
    <select id="tl-month-select">
      <option value="all">All time</option>
      ${monthList.map(m => `<option value="${monthKey(m)}">${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</option>`).join('')}
    </select>
    <button id="tl-next" class="tl-nav-btn">›</button>
    ${state.timelineMonth !== 'all' ? '<button id="tl-today" class="btn-secondary" style="margin-left:8px;">Today</button>' : ''}
  `;

  // Resolve the current task set + date window based on state.timelineMonth
  let tasks = allDatedTasks, min, max;
  if (state.timelineMonth && state.timelineMonth !== 'all') {
    const [y, mo] = state.timelineMonth.split('-').map(Number);
    min = new Date(y, mo-1, 1); min.setDate(min.getDate() - 2);
    max = new Date(y, mo, 0); max.setDate(max.getDate() + 3);
    tasks = allDatedTasks.filter(t => new Date(t.due_date) >= min && new Date(t.start_date) <= max);
  } else {
    const dates = allDates;
    min = new Date(Math.min(...dates)); max = new Date(Math.max(...dates));
    min.setDate(min.getDate() - 3); max.setDate(max.getDate() + 3);
  }
  const totalMs = max - min;
  const pct = (d) => ((d - min) / totalMs) * 100;

  const months = [];
  let cur = new Date(min.getFullYear(), min.getMonth(), 1);
  while (cur <= max) { months.push(new Date(cur)); cur.setMonth(cur.getMonth() + 1); }

  const ticks = months.map(m => `<div class="gantt-tick" style="left:${pct(m)}%">${m.toLocaleDateString(undefined,{month:'short',year:'numeric'})}</div>`).join('');
  const gridLines = months.map(m => `<div class="gantt-grid-line" style="left:${pct(m)}%"></div>`).join('');
  const todayPct = pct(new Date());
  const todayLine = (todayPct>=0 && todayPct<=100) ? `<div class="gantt-today" style="left:${todayPct}%"></div>` : '';

  // Highlight the current month as a shaded band
  const now = new Date();
  const curMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const curMonthEnd = new Date(now.getFullYear(), now.getMonth()+1, 1);
  const bandStart = pct(curMonthStart), bandEnd = pct(curMonthEnd);
  const monthBand = (bandEnd > 0 && bandStart < 100)
    ? `<div class="gantt-month-band" style="left:${Math.max(bandStart,0)}%; width:${Math.min(bandEnd,100)-Math.max(bandStart,0)}%"></div>`
    : '';

  if (!tasks.length) {
    el.innerHTML = '';
    el.appendChild(toolbar);
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No tasks fall in this month.';
    el.appendChild(empty);
    wireTimelineToolbar(monthList, monthKey);
    return;
  }

  // Group tasks by their group (ungrouped last); only show headers if any task is grouped
  const groupOf = (t) => state.groups.find(g => g.id === t.group_id);
  const hasAnyGroup = tasks.some(t => t.group_id);
  const sortedTasks = [...tasks].sort((a,b) => {
    const ga = groupOf(a) ? groupOf(a).name : '\uFFFF';
    const gb = groupOf(b) ? groupOf(b).name : '\uFFFF';
    if (ga !== gb) return ga < gb ? -1 : 1;
    return (a.start_date||'') < (b.start_date||'') ? -1 : 1;
  });

  let lastGroupKey;
  const rowsHtml = [];
  sortedTasks.forEach(t => {
    const g = groupOf(t);
    const groupKey = g ? g.id : '__ungrouped';
    if (hasAnyGroup && groupKey !== lastGroupKey) {
      rowsHtml.push(`
        <div class="gantt-group-header">
          <div class="glabel">${g ? escapeHtml(g.name) : 'Ungrouped'}</div>
          <div class="gtrack"></div>
        </div>`);
      lastGroupKey = groupKey;
    }
    const start = pct(new Date(t.start_date));
    const end = pct(new Date(t.due_date));
    const width = Math.max(end - start, 1.2);
    rowsHtml.push(`
      <div class="gantt-row">
        <div class="gantt-row-label">
          <span class="proj-dot" style="background:${projectColor(t.project_id)}"></span>
          ${escapeHtml(t.name)}
        </div>
        <div class="gantt-track">
          ${monthBand}${gridLines}${todayLine}
          <div class="gantt-bar" data-id="${t.id}" style="left:${start}%; width:${width}%; background:${STATUS_COLOR[t.status]}">
            <span>${escapeHtml(t.name)}</span>
          </div>
        </div>
      </div>`);
  });

  el.innerHTML = '';
  el.appendChild(toolbar);
  const wrap = document.createElement('div');
  wrap.className = 'gantt-wrap';
  wrap.innerHTML = `
      <div class="gantt-header">
        <div class="gantt-label-col">Task</div>
        <div class="gantt-scale">${monthBand}${ticks}</div>
      </div>
      ${rowsHtml.join('')}`;
  el.appendChild(wrap);

  el.querySelectorAll('.gantt-bar').forEach(bar => {
    bar.addEventListener('click', () => openTaskModal(bar.dataset.id));
  });
  wireTimelineToolbar(monthList, monthKey);
}

function wireTimelineToolbar(monthList, monthKey){
  const sel = document.getElementById('tl-month-select');
  sel.value = state.timelineMonth || 'all';
  sel.addEventListener('change', () => { state.timelineMonth = sel.value; render(); });

  const keys = monthList.map(monthKey);
  document.getElementById('tl-prev').addEventListener('click', () => {
    const cur = state.timelineMonth === 'all' ? keys.length : keys.indexOf(state.timelineMonth);
    const i = cur <= 0 ? keys.length - 1 : cur - 1;
    state.timelineMonth = keys[i]; render();
  });
  document.getElementById('tl-next').addEventListener('click', () => {
    const cur = state.timelineMonth === 'all' ? -1 : keys.indexOf(state.timelineMonth);
    const i = cur >= keys.length - 1 ? 0 : cur + 1;
    state.timelineMonth = keys[i]; render();
  });
  const todayBtn = document.getElementById('tl-today');
  if (todayBtn) todayBtn.addEventListener('click', () => { state.timelineMonth = 'all'; render(); });
}

function fmtDate(d){
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------------------------------------------------------------------
// RENDER — DASHBOARD
// ---------------------------------------------------------------------
function renderDashboard(){
  const el = document.getElementById('dashboard-view');
  const tasks = visibleTasks();
  if (!tasks.length) {
    el.innerHTML = '<div class="empty-state">No tasks yet — add some to see achievement here.</div>';
    return;
  }
  const active = tasks.filter(t => t.status !== 'Cancelled');
  const completed = active.filter(t => t.status === 'Completed');
  const overall = active.length ? Math.round(completed.length / active.length * 100) : 0;

  const statusCounts = {};
  STATUSES.forEach(s => statusCounts[s] = 0);
  tasks.forEach(t => statusCounts[t.status] = (statusCounts[t.status]||0) + 1);

  const statusRows = STATUSES.map(s => `
    <div class="stat-row">
      <span class="dot" style="background:${STATUS_COLOR[s]}"></span>
      <span class="lbl">${s}</span>
      <span class="val">${statusCounts[s]}</span>
    </div>`).join('');

  // Per-project achievement = % of that project's active tasks marked Completed
  const projectsToShow = state.activeProject === 'all' ? state.projects : state.projects.filter(p => p.id === state.activeProject);
  const projRows = projectsToShow.map(p => {
    const pActive = tasks.filter(t => t.project_id === p.id && t.status !== 'Cancelled');
    const pDone = pActive.filter(t => t.status === 'Completed');
    const pct = pActive.length ? Math.round(pDone.length / pActive.length * 100) : 0;
    return `
      <div class="proj-progress-row">
        <div class="proj-progress-head">
          <span class="name"><span class="proj-dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${projectColor(p.id)}"></span> ${escapeHtml(p.name)}</span>
          <span class="pct">${pct}% · ${pDone.length}/${pActive.length} done</span>
        </div>
        <div class="ach-bar-track"><div class="ach-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
  }).join('') || '<div class="attach-empty">No projects yet</div>';

  // Per-task list, soonest due date first
  const sorted = [...tasks].sort((a,b) => (a.due_date||'9999') < (b.due_date||'9999') ? -1 : 1);
  const taskRows = sorted.map(t => `
    <div class="task-list-row">
      <span class="t-status" style="background:${STATUS_COLOR[t.status]}">${t.status}</span>
      <span class="t-name" data-id="${t.id}">${escapeHtml(t.name)}</span>
      <span class="t-due">${t.due_date ? fmtDate(t.due_date) : '—'}</span>
    </div>`).join('');

  el.innerHTML = `
    <div class="dash-grid">
      <div class="dash-card">
        <h3>አጠቃላይ አፈፃፀም</h3>
        <div class="big-ring">
          <span class="num">${overall}%</span>
          <span class="lbl">${completed.length} of ${active.length} active task${active.length===1?'':'s'} completed</span>
        </div>
        <div class="stat-rows">${statusRows}</div>
      </div>
      <div class="dash-card">
        <h3>Achievement by project</h3>
        ${projRows}
      </div>
      <div class="dash-card" style="grid-column:1 / -1;">
        <h3>Every task</h3>
        ${taskRows}
      </div>
    </div>`;

  el.querySelectorAll('.t-name').forEach(n => n.addEventListener('click', () => openTaskModal(n.dataset.id)));
}

let editingTaskId = null;

function renderAssigneeSelect(){
  const sel = document.getElementById('f-assignee');
  sel.innerHTML = '<option value="">Unassigned</option>' +
    state.profiles.map(p => `<option value="${p.id}">${escapeHtml(p.full_name)}</option>`).join('');
}
function renderProjectFormSelect(){
  const sel = document.getElementById('f-project');
  sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
}
function renderGroupSelect(projectId){
  const sel = document.getElementById('f-group');
  const groups = state.groups.filter(g => g.project_id === projectId);
  sel.innerHTML = '<option value="">No group</option>' +
    groups.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');
}
document.getElementById('f-project').addEventListener('change', (e) => {
  renderGroupSelect(e.target.value);
});
document.getElementById('new-group-btn').addEventListener('click', async () => {
  const projectId = document.getElementById('f-project').value;
  if (!projectId) { alert('Pick a project first.'); return; }
  const name = prompt('New group name (e.g. a phase or section of this project):');
  if (!name || !name.trim()) return;
  const { data, error } = await sb.from('task_groups')
    .insert({ project_id: projectId, name: name.trim() }).select().single();
  if (error) { alert('Could not create group: ' + error.message); return; }
  state.groups.push(data);
  renderGroupSelect(projectId);
  document.getElementById('f-group').value = data.id;
});

function openTaskModal(id){
  editingTaskId = id || null;
  const t = id ? state.tasks.find(t => t.id === id) : null;
  document.getElementById('modal-title').textContent = t ? 'Edit task' : 'New task';
  document.getElementById('delete-task-btn').style.display = t ? 'inline-block' : 'none';
  document.getElementById('f-name').value = t ? t.name : '';
  const projId = t ? t.project_id : (state.activeProject !== 'all' ? state.activeProject : (state.projects[0] && state.projects[0].id));
  document.getElementById('f-project').value = projId;
  renderGroupSelect(projId);
  document.getElementById('f-group').value = t && t.group_id ? t.group_id : '';
  document.getElementById('f-status').value = t ? t.status : 'To Do';
  document.getElementById('f-assignee').value = t && t.assignee_id ? t.assignee_id : '';
  document.getElementById('f-start').value = t && t.start_date ? t.start_date : '';
  document.getElementById('f-due').value = t && t.due_date ? t.due_date : '';
  document.getElementById('f-notes').value = t && t.description ? t.description : '';
  document.getElementById('task-modal-backdrop').style.display = 'flex';

  document.getElementById('attach-input').value = '';
  if (t) {
    document.getElementById('attach-hint').style.display = 'none';
    document.getElementById('attach-input').style.display = 'inline-block';
    loadAttachments(t.id);
  } else {
    document.getElementById('attach-list').innerHTML = '';
    document.getElementById('attach-hint').style.display = 'block';
    document.getElementById('attach-input').style.display = 'none';
  }
}
function closeTaskModal(){
  document.getElementById('task-modal-backdrop').style.display = 'none';
  editingTaskId = null;
}
document.getElementById('new-task-btn').addEventListener('click', () => openTaskModal(null));
document.getElementById('close-modal').addEventListener('click', closeTaskModal);
document.getElementById('cancel-modal-btn').addEventListener('click', closeTaskModal);

document.getElementById('task-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    name: document.getElementById('f-name').value.trim(),
    project_id: document.getElementById('f-project').value,
    group_id: document.getElementById('f-group').value || null,
    status: document.getElementById('f-status').value,
    assignee_id: document.getElementById('f-assignee').value || null,
    start_date: document.getElementById('f-start').value || null,
    due_date: document.getElementById('f-due').value || null,
    description: document.getElementById('f-notes').value || null,
  };
  if (editingTaskId) {
    await sb.from('tasks').update(payload).eq('id', editingTaskId);
  } else {
    payload.created_by = state.me.id;
    await sb.from('tasks').insert(payload);
  }
  closeTaskModal();
});

document.getElementById('delete-task-btn').addEventListener('click', async () => {
  if (!editingTaskId) return;
  if (!confirm('Delete this task? This can\'t be undone.')) return;
  await sb.from('tasks').delete().eq('id', editingTaskId);
  closeTaskModal();
});

// ---------------------------------------------------------------------
// ATTACHMENTS
// ---------------------------------------------------------------------
const ATTACH_BUCKET = 'task-attachments';
let currentAttachments = [];

async function loadAttachments(taskId){
  const { data, error } = await sb.from('task_attachments')
    .select('*').eq('task_id', taskId).order('created_at');
  currentAttachments = error ? [] : (data || []);
  renderAttachments();
}

function renderAttachments(){
  const list = document.getElementById('attach-list');
  if (!currentAttachments.length) {
    list.innerHTML = '<div class="attach-empty">No documents attached yet</div>';
    return;
  }
  list.innerHTML = currentAttachments.map(a => {
    const who = state.profiles.find(p => p.id === a.uploaded_by);
    return `
      <div class="attach-item" data-id="${a.id}" data-path="${escapeHtml(a.file_path)}">
        <span class="a-icon">📄</span>
        <a class="a-name" data-download>${escapeHtml(a.file_name)}</a>
        <span class="a-meta">${who ? escapeHtml(who.full_name.split(' ')[0]) : ''} · ${fmtSize(a.file_size)}</span>
        <button class="a-del" title="Delete">&times;</button>
      </div>`;
  }).join('');

  list.querySelectorAll('.attach-item').forEach(row => {
    const path = row.dataset.path;
    row.querySelector('[data-download]').addEventListener('click', async () => {
      const { data, error } = await sb.storage.from(ATTACH_BUCKET).createSignedUrl(path, 60);
      if (!error && data) window.open(data.signedUrl, '_blank');
    });
    row.querySelector('.a-del').addEventListener('click', async () => {
      if (!confirm('Remove this document?')) return;
      await sb.storage.from(ATTACH_BUCKET).remove([path]);
      await sb.from('task_attachments').delete().eq('id', row.dataset.id);
      currentAttachments = currentAttachments.filter(a => a.id !== row.dataset.id);
      renderAttachments();
    });
  });
}

function fmtSize(bytes){
  if (!bytes) return '';
  if (bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

document.getElementById('attach-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file || !editingTaskId) return;
  const uploadingEl = document.getElementById('attach-uploading');
  uploadingEl.style.display = 'block';
  const path = `${editingTaskId}/${Date.now()}_${file.name}`;
  const { error: upErr } = await sb.storage.from(ATTACH_BUCKET).upload(path, file);
  if (upErr) {
    uploadingEl.style.display = 'none';
    alert('Upload failed: ' + upErr.message);
    return;
  }
  const { data, error } = await sb.from('task_attachments').insert({
    task_id: editingTaskId, file_name: file.name, file_path: path,
    file_size: file.size, uploaded_by: state.me.id,
  }).select().single();
  uploadingEl.style.display = 'none';
  e.target.value = '';
  if (!error && data) { currentAttachments.push(data); renderAttachments(); }
});

// ---------------------------------------------------------------------
// PROJECT MODAL
// ---------------------------------------------------------------------
function openProjectModal(){ document.getElementById('project-modal-backdrop').style.display = 'flex'; }
function closeProjectModal(){ document.getElementById('project-modal-backdrop').style.display = 'none'; document.getElementById('project-form').reset(); }
document.getElementById('close-project-modal').addEventListener('click', closeProjectModal);
document.getElementById('cancel-project-btn').addEventListener('click', closeProjectModal);
document.getElementById('project-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('p-name').value.trim();
  const description = document.getElementById('p-desc').value.trim() || null;
  const { data } = await sb.from('projects').insert({ name, description, created_by: state.me.id }).select().single();
  closeProjectModal();
  if (data) { state.activeProject = data.id; renderProjectSelect(); document.getElementById('project-select').value = data.id; render(); }
});

// INIT — restore existing session on load
// ---------------------------------------------------------------------
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) boot(session); else showLogin();
})();
</script>
